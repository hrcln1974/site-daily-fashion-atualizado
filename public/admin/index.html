<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel | Daily Fashion</title><meta name="robots" content="noindex,nofollow"><style>
:root{--black:#0d0b0b;--panel:#151515;--gold:#d8a04f;--gold2:#f4c06a;--text:#f1f1f1;--muted:#999;--border:rgba(216,160,79,.25)}*{box-sizing:border-box}body{margin:0;background:var(--black);color:var(--text);font:14px Arial,sans-serif}.hidden{display:none!important}.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:#000;color:#fff;padding:24px 16px;position:sticky;top:0;height:100vh;border-right:1px solid var(--border)}.brand{font-size:20px;letter-spacing:1px;color:var(--gold2);margin:5px 10px 30px}.brand span{color:#fff}.nav button{display:block;width:100%;text-align:left;background:none;border:0;color:#ccc;padding:11px 14px;border-radius:8px;cursor:pointer;font-size:13px}.nav button.active,.nav button:hover{background:#221a10;color:var(--gold2)}.main{padding:28px;max-width:1400px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:25px}.top h1{font-weight:600;margin:.3rem 0;color:#fff}.logout{background:transparent;border:1px solid var(--gold);color:var(--gold);padding:9px 14px;border-radius:5px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.kpi{background:var(--panel);border:1px solid var(--border);padding:18px;border-radius:10px}.kpi span{color:var(--muted)}.kpi b{display:block;font-size:26px;margin-top:7px;color:var(--gold2)}.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px;margin-top:18px;overflow:auto}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.btn{background:linear-gradient(45deg,#c78935,#f4c06a);color:#111;border:0;padding:10px 14px;border-radius:6px;cursor:pointer;font-weight:bold}.btn.light{background:#222;color:#eee}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:10px;border-bottom:1px solid #222;text-align:left;vertical-align:top;color:#ddd}th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;background:#1b1610;padding:14px;border-radius:9px;margin-bottom:18px}.form label{font-size:12px;font-weight:600;color:#ddd}.form input,.form select,.form textarea{width:100%;margin-top:5px;padding:10px;border:1px solid #3a2f22;border-radius:6px;background:#0f0d0d;color:#fff}.form textarea{min-height:80px}.full{grid-column:1/-1}.status{font-size:12px;color:var(--muted)}.notice{padding:10px;background:#241d10;border:1px solid #4a3a1c;color:#e8c98a;border-radius:7px;margin-bottom:12px}.login{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#1a1a1a,#000)}.login-box{background:var(--panel);width:min(420px,calc(100% - 32px));padding:30px;border-radius:12px;border:1px solid var(--border)}.login-box h1{margin-top:0;color:var(--gold2)}.login-box input{display:block;width:100%;margin:10px 0;padding:13px;border:1px solid #333;background:#0f0d0d;color:#fff;border-radius:6px}.error{color:#e06565;margin:8px 0}.thumb{width:58px;height:58px;object-fit:cover;border-radius:6px}.muted{color:var(--muted)}@media(max-width:1050px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:900px){.shell{grid-template-columns:1fr}.side{height:auto;position:static}.nav{display:grid;grid-template-columns:repeat(2,1fr)}.main{padding:16px}.form{grid-template-columns:1fr}}
</style><style>
.back-site{position:fixed;top:16px;right:20px;z-index:9999;display:inline-flex;align-items:center;padding:9px 14px;border:1px solid rgba(216,160,79,.55);border-radius:999px;background:#111;color:#f4c06a;text-decoration:none;font:600 12px/1 Arial,sans-serif;letter-spacing:.05em;text-transform:uppercase;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.back-site:hover{transform:translateY(-1px)}
</style>
</head><body>
  <a class="back-site" href="/" aria-label="Voltar ao site público">← Ver site público</a>
<div id="login" class="login"><form class="login-box" id="loginForm"><h1>Daily <span style="color:#fff">Fashion</span></h1><p style="color:#aaa">Painel administrativo.</p><input id="email" type="email" placeholder="E-mail" required><input id="password" type="password" placeholder="Senha" required><button class="btn" style="width:100%">Entrar</button><div id="loginError" class="error"></div></form></div>
<div id="app" class="shell hidden"><aside class="side"><div class="brand">Daily <span>Fashion</span><br><small style="font-size:10px;letter-spacing:.25em;color:#888">PAINEL</small></div><nav class="nav" id="nav">
<button data-view="dashboard" class="active">Dashboard</button><button data-view="products">Catálogo (Fotos)</button><button data-view="videos">Vídeos</button><button data-view="orders">Pedidos</button><button data-view="settings">Configurações</button></nav></aside>
<main class="main"><div class="top"><div><div style="color:var(--gold);letter-spacing:.18em;font-size:11px">PAINEL DAILY FASHION</div><h1 id="title">Dashboard</h1></div><button class="logout" id="logout">Sair</button></div><section id="content"></section></main></div>
<script>
const $=s=>document.querySelector(s);let current='dashboard';let editing=null;
const labels={products:['Catálogo (Peças / Fotos)',['name','category','price','encomenda','prazo','image','status','order']],videos:['Vídeos',['title','category','url','type','caption','status','order']],orders:['Pedidos',['customer_name','customer_phone','customer_email','address','total','status']]};
const FIELD_OPTIONS={category:['Vestidos','Conjuntos','Blusas','Saias','Macacões','Acessórios','Institucional','Bastidores','Coleção','Reels'],status:['novo','confirmado','em_preparacao','enviado','concluido','cancelado']};
async function api(url,opt={}){const isForm=typeof FormData!=='undefined'&&opt.body instanceof FormData;const headers={...(opt.headers||{})};if(!isForm&&!headers['Content-Type'])headers['Content-Type']='application/json';const r=await fetch(url,{...opt,headers});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Erro');return d}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function boot(){try{await api('/api/auth/me');$('#login').classList.add('hidden');$('#app').classList.remove('hidden');render()}catch(e){}}
$('#loginForm').onsubmit=async e=>{e.preventDefault();$('#loginError').textContent='';try{await api('/api/auth/login',{method:'POST',body:JSON.stringify({email:$('#email').value,password:$('#password').value})});boot()}catch(x){$('#loginError').textContent=x.message}};
$('#logout').onclick=async()=>{await api('/api/auth/logout',{method:'POST'});location.reload()};
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');current=b.dataset.view;editing=null;render()});
async function render(){try{const c=$('#content');$('#title').textContent=current==='dashboard'?'Dashboard':current==='settings'?'Configurações':labels[current]?.[0]||current;
if(current==='dashboard'){const d=await api('/api/dashboard');c.innerHTML='<div class="grid">'+[['Peças no catálogo',d.products],['Publicadas',d.publicados],['Sob encomenda',d.encomenda],['Vídeos',d.videos],['Pedidos',d.orders],['Novos pedidos',d.newOrders]].map(x=>`<div class="kpi"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')+'</div><div class="card"><h2 style="color:#f4c06a">Site integrado</h2><p>O catálogo e os vídeos cadastrados aqui aparecem automaticamente no site público através da API. Cadastre ou edite uma peça e atualize o site para conferir.</p></div>';return}
if(current==='settings'){const s=await api('/api/settings');c.innerHTML='<div class="card"><div class="notice">Estas configurações alimentam o site público (WhatsApp e redes sociais) automaticamente.</div><form class="form" id="settingsForm">'+Object.entries(s).map(([k,v])=>`<label>${esc(k)}<input name="${esc(k)}" value="${esc(v)}"></label>`).join('')+'<div class="full"><button class="btn">Salvar configurações</button></div></form></div>';$('#settingsForm').onsubmit=async e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target));await api('/api/settings',{method:'PUT',body:JSON.stringify(o)});alert('Configurações salvas e integradas ao site.');};return}
if(current==='orders'){const rows=await api('/api/orders');c.innerHTML='<div class="card"><div class="actions"><button class="btn light" id="refreshOrders">Atualizar</button></div><div class="notice">Pedidos enviados pelo catálogo público. Altere o status para acompanhar o atendimento.</div><table><thead><tr><th>ID</th><th>Cliente</th><th>Contato</th><th>Total</th><th>Status</th><th>Data</th><th>Ações</th></tr></thead><tbody>'+rows.map(r=>`<tr><td>DF-${String(r.id).padStart(5,'0')}</td><td>${esc(r.customer_name)}</td><td>${esc(r.customer_phone)}</td><td>${esc(r.total)}</td><td><select data-order-status="${r.id}"><option ${r.status==='novo'?'selected':''}>novo</option><option ${r.status==='confirmado'?'selected':''}>confirmado</option><option ${r.status==='em_preparacao'?'selected':''}>em_preparacao</option><option ${r.status==='enviado'?'selected':''}>enviado</option><option ${r.status==='concluido'?'selected':''}>concluido</option><option ${r.status==='cancelado'?'selected':''}>cancelado</option></select></td><td>${esc(r.created_at||'')}</td><td><button class="btn light" onclick="deleteOrder(${r.id})">Excluir</button></td></tr>`).join('')+'</tbody></table></div>';c.querySelectorAll('[data-order-status]').forEach(x=>x.onchange=async()=>{await api('/api/orders/'+x.dataset.orderStatus,{method:'PUT',body:JSON.stringify({status:x.value})});render()});$('#refreshOrders').onclick=()=>render();return}
const cfg=labels[current];const rows=await api('/api/'+current);const cols=cfg[1];let html='<div class="card"><div class="actions"><button class="btn" id="new">+ Novo registro</button><button class="btn light" id="refresh">Atualizar</button></div>';
if(current==='products')html+='<div class="notice"><b>Fotos do catálogo:</b> escolha um arquivo de imagem abaixo ou informe o caminho/URL da foto. Marque <b>encomenda = sim</b> para peças feitas sob encomenda e preencha o prazo (ex: "7 dias úteis"). O preço é texto livre (ex: "R$ 129,90").</div>';
if(current==='videos')html+='<div class="notice"><b>Cadastro de vídeo:</b> escolha um arquivo .mp4 abaixo OU cole o link do Instagram, Facebook ou YouTube no campo URL. Se o campo Tipo ficar em branco, o sistema detecta a origem automaticamente pelo link.</div>';
if(editing)html+=formHtml(editing,cols);
html+='<table><thead><tr><th>ID</th>'+cols.map(x=>`<th>${esc(x)}</th>`).join('')+'<th>Ações</th></tr></thead><tbody>'+rows.map(r=>`<tr><td>${r.id}</td>${cols.map(x=>`<td>${x==='image'||x==='url'?(r[x]?`<a href="${esc(r[x])}" target="_blank" rel="noopener"><img class="thumb" src="${esc(r[x])}" onerror="this.style.display='none'"></a>`:'-'):esc(r[x])}</td>`).join('')}<td><button class="btn light" onclick="editRow(${r.id})">Editar</button> <button class="btn" onclick="del(${r.id})">Excluir</button></td></tr>`).join('')+'</tbody></table></div>';
c.innerHTML=html;$('#new').onclick=()=>{editing={id:null};render()};$('#refresh').onclick=()=>{editing=null;render()};if(editing){$('#crudForm').onsubmit=saveRow}} catch(e){$('#content').innerHTML='<div class="card"><div class="error">'+esc(e.message||'Erro ao carregar dados')+'</div></div>'}
}
function formHtml(obj,cols){
 const media=current==='products'||current==='videos';
 const mediaField=current==='products'?'image':'url';
 const fileAccept=current==='products'?'.jpg,.jpeg,.png,.webp,.gif':'.mp4,.webm,.mov';
 const fieldsHtml=cols.map(x=>{
  let val=obj[x]??'';
  let type=['caption'].includes(x)?'textarea':'input';
  if(x==='status'){
   const opts=current==='products'?['publicado','rascunho','inativo','esgotado']:['publicado','rascunho','oculto'];
   return `<label>${esc(x)}<select name="${esc(x)}">${opts.map(o=>`<option value="${o}" ${val===o?'selected':''}>${o}</option>`).join('')}</select></label>`;
  }
  if(x==='encomenda'){
   return `<label>${esc(x)} (sob encomenda?)<select name="${esc(x)}"><option value="nao" ${val==='nao'?'selected':''}>não — pronta entrega</option><option value="sim" ${val==='sim'?'selected':''}>sim — sob encomenda</option></select></label>`;
  }
  if(x==='type'&&current==='videos'){
   return `<label>${esc(x)}<select name="${esc(x)}"><option value="" ${!val?'selected':''}>Detectar automaticamente</option>${['local','youtube','instagram','facebook'].map(o=>`<option value="${o}" ${val===o?'selected':''}>${o}</option>`).join('')}</select></label>`;
  }
  if(type==='textarea')return `<label>${esc(x)}<textarea name="${esc(x)}">${esc(val)}</textarea></label>`;
  if(FIELD_OPTIONS[x]){const dl='dl_'+x;return `<label>${esc(x)}<input name="${esc(x)}" list="${dl}" value="${esc(val)}" placeholder="Escolha ou digite..."><datalist id="${dl}">${FIELD_OPTIONS[x].map(o=>`<option value="${esc(o)}">`).join('')}</datalist></label>`;}
  return `<label>${esc(x)}${x==='prazo'?' (só p/ sob encomenda)':''}<input name="${esc(x)}" value="${esc(val)}"></label>`;
 }).join('');
 const upload=media?`<div class="full media-upload"><label>Arquivo para ${current==='products'?'foto da peça':'vídeo'}<input id="mediaFile" type="file" accept="${fileAccept}"><small class="status">Ao escolher o arquivo e salvar, o upload será feito automaticamente. Ou preencha o campo "${mediaField}" acima com uma URL/link.</small></label></div>`:'';
 return `<form class="form" id="crudForm"><div class="full"><strong>${obj.id?'Editando registro #'+obj.id:'Novo registro'}</strong></div>${fieldsHtml}${upload}<div class="full"><button class="btn" id="saveBtn">Salvar</button> <button type="button" class="btn light" onclick="editing=null;render()">Cancelar</button><span id="saveStatus" class="status"></span></div></form>`;
}
window.deleteOrder=async id=>{if(confirm('Excluir este pedido?')){await api('/api/orders/'+id,{method:'DELETE'});render()}};window.editRow=async id=>{const rows=await api('/api/'+current);editing=rows.find(r=>r.id===id)||null;render()};window.del=async id=>{if(confirm('Excluir este registro?')){await api('/api/'+current+'/'+id,{method:'DELETE'});editing=null;render()}};
async function saveRow(e){
 e.preventDefault();
 const data=Object.fromEntries(new FormData(e.target));
 delete data.file;
 const media=current==='products'||current==='videos';
 const mediaField=current==='products'?'image':'url';
 const file=document.getElementById('mediaFile')?.files?.[0];
 const status=document.getElementById('saveStatus');
 try{
  if(media&&file){
   status.textContent='Enviando arquivo...';
   const fd=new FormData(); fd.append('file',file);
   const uploaded=await api('/api/upload',{method:'POST',body:fd});
   data[mediaField]=uploaded.url;
   status.textContent='Arquivo enviado. Salvando registro...';
  }
  if(current==='videos'&&!data.type&&data.url)data.type=/instagram\.com/i.test(data.url)?'instagram':/facebook\.com|fb\.watch/i.test(data.url)?'facebook':/youtube\.com|youtu\.be/i.test(data.url)?'youtube':'local';
  if(!data[mediaField] && media) throw Error(current==='products'?'Informe uma URL ou selecione uma foto para a peça.':'Informe uma URL ou selecione um arquivo de vídeo.');
  if(current==='products'&&!data.name) throw Error('Informe o nome da peça.');
  if(editing?.id)await api('/api/'+current+'/'+editing.id,{method:'PUT',body:JSON.stringify(data)});
  else await api('/api/'+current,{method:'POST',body:JSON.stringify(data)});
  editing=null;render();
 }catch(err){status.textContent=err.message||'Erro ao salvar';}
}
boot();
</script></body></html>
